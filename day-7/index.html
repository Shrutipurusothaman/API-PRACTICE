<!DOCTYPE html>
<html>

<head>
    <title>Currency Converter</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="converter">
        <h2>Currency Converter</h2>

        <div class="form-row">
            <input type="number" id="amount" placeholder="Amount">
        </div>

        <div class="form-row">
            <select id="from">
                <option>USD</option>
                <option>EUR</option>
                <option>INR</option>
            </select>

            <select id="to">
                <option>INR</option>
                <option>USD</option>
                <option>EUR</option>
            </select>
        </div>

        <button onclick="convert()">Convert</button>

        <p id="result"></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
